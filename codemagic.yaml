workflows:
  zevio-ai-ios-unsigned:
    name: Zevio AI - Unsigned iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
    scripts:
      - name: Install frontend dependencies
        script: |
          cd frontend
          npm install
      - name: Build web app
        script: |
          cd frontend
          npm run build
      - name: Add iOS platform
        script: |
          cd frontend
          npx cap add ios
      - name: Sync Capacitor assets
        script: |
          cd frontend
          npx cap sync ios
      - name: Build unsigned iOS app
        script: |
          cd frontend
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        script: |
          cd frontend
          APP_PATH="build/ios/DerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/App.app
          (cd artifacts && zip -r Zevio-AI-unsigned.ipa Payload)
    artifacts:
      - frontend/artifacts/*.ipa
      - /tmp/xcodebuild_logs/*.log
